  <radialGradient id="halo"><stop stop-color="#4D6FBA" stop-opacity=".16"/><stop offset="1" stop-color="#4D6FBA" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8194B4" stroke-opacity=".055"/></pattern>
</defs>
