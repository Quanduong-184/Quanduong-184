<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Minh-Quan Duong — Computer Vision and Multimodal AI</title>
<desc id="desc">A dark navy profile banner with cyan and violet accents, an abstract connected network, and research interests in efficient multimodal learning and generative models.</desc>
<defs>
